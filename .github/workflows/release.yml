name: Build Clean Library Archive
# 触发条件：推送以 v 开头的版本标签
on:
  push:
    tags:
      - 'v*'

# 权限配置
permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      # checkout，原生Node24
      - name: Checkout source code
        uses: actions/checkout@v5

      # 使用 git archive 打包（自动遵守 .gitattributes 剔除无关文件）
      - name: Create clean zip package
        run: |
          git archive --format=zip --prefix=RobotEye/ -o RobotEye-${GITHUB_REF#refs/tags/}.zip HEAD

      # release action升级v3，原生Node24
      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: RobotEye-*.zip
